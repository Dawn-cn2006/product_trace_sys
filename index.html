<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食品二维码溯源系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "微软雅黑", sans-serif;
      background: #f7f8fa;
      padding: 15px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .header {
      background: #2E7D32;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .product-item {
      padding: 15px;
      background: #e9f7ef;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
      border: 1px solid #d1fae5;
    }
    .product-item h3 {
      color: #2E7D32;
      margin-bottom: 6px;
    }
    .info p {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    .title {
      font-size: 20px;
      margin-bottom: 10px;
      color: #222;
    }
    .tag {
      background: #e6f7ef;
      color: #2E7D32;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }
    .timeline {
      border-left: 3px solid #2E7D32;
      padding-left: 15px;
      margin: 10px 0;
    }
    .timeline p {
      margin: 10px 0;
      position: relative;
    }
    .timeline p::before {
      content: "";
      width: 10px;
      height: 10px;
      background: #2E7D32;
      border-radius: 50%;
      position: absolute;
      left: -21px;
      top: 5px;
    }
    .back-btn {
      display: inline-block;
      background: #2E7D32;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      margin-top: 15px;
      text-decoration: none;
    }
    .error {
      color: #d32f2f;
      font-weight: bold;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>食品二维码溯源系统</h1>
    <p>一物一码 | 全程溯源 | 安全可查</p>
  </div>

  <div id="content"></div>
</div>

<script>
  // 获取URL中的id参数
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');
  const content = document.getElementById('content');

  // 加载数据并渲染页面
  async function loadData() {
    const res = await fetch('products.json');
    const products = await res.json();

    // 如果有id → 显示溯源详情
    if (productId) {
      const item = products.find(p => p.id === productId);
      if (!item) {
        content.innerHTML = `<div class="error">未找到该产品信息</div>`;
        return;
      }
      content.innerHTML = `
        <div class="card">
          <h2 class="title">${item.name}</h2>
          <span class="tag">检测结果：${item.testResult}</span>
          <div class="info">
            <p><strong>产品编号：</strong>${item.id}</p>
            <p><strong>生产批次：</strong>${item.batch}</p>
            <p><strong>产地：</strong>${item.origin}</p>
            <p><strong>生产日期：</strong>${item.date}</p>
          </div>

          <h3 style="margin:16px 0 8px;">📦 物流时间轴</h3>
          <div class="timeline">
            ${item.logistics.map(t => `<p>${t}</p>`).join('')}
          </div>

          <h3 style="margin:16px 0 8px;">✅ 溯源结论</h3>
          <p>${item.conclusion}</p>

          <a href="index.html" class="back-btn">返回产品列表</a>
        </div>
      `;
    } else {
      // 无id → 显示产品列表
      let listHtml = '';
      products.forEach(p => {
        listHtml += `
          <div class="product-item" onclick="window.location.href='index.html?id=${p.id}'">
            <h3>${p.name}</h3>
            <p>批次：${p.batch} | 产地：${p.origin}</p>
          </div>
        `;
      });
      content.innerHTML = `
        <div class="card">
          <h2 class="title">食品列表（点击查看溯源）</h2>
          ${listHtml}
        </div>
      `;
    }
  }

  loadData();
</script>

</body>
</html>
