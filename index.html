<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Traceability System</title>
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #f4f7f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content { padding: 20px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
        .label { font-weight: bold; color: #7f8c8d; }
        .value { font-weight: 500; text-align: right; }
        
        .status-badge {
            display: block;
            background: #e8f8f5;
            color: var(--primary);
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        .timeline {
            margin-top: 20px;
            padding-left: 20px;
            border-left: 2px solid var(--primary);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 15px;
            padding-left: 15px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -27px;
            top: 5px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
        }
        .timeline-date { font-size: 0.85em; color: #95a5a6; }
        
        .error { text-align: center; padding: 40px; color: #e74c3c; }
        .loading { text-align: center; padding: 40px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="loading">Scanning traceability data...</div>
</div>

<script>
    async function loadTraceability() {
        const app = document.getElementById('app');
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            app.innerHTML = '<div class="error"><h2>Error</h2><p>No QR Code ID provided.</p></div>';
            return;
        }

        try {
            const response = await fetch('products.json');
            const data = await response.json();
            const product = data.find(p => p.id === productId);

            if (!product) {
                app.innerHTML = '<div class="error"><h2>Not Found</h2><p>Invalid ID or Product expired.</p></div>';
                return;
            }

            // Build Timeline HTML
            const timelineHtml = product.timeline.map(item => `
                <div class="timeline-item">
                    <div class="timeline-date">${item.date}</div>
                    <div class="timeline-status">${item.status}</div>
                </div>
            `).join('');

            app.innerHTML = `
                <div class="header">
                    <h2 style="margin:0">Traceability Record</h2>
                    <small>Official Product Verification</small>
                </div>
                <div class="content">
                    <div class="info-row"><span class="label">Product Name</span><span class="value">${product.name}</span></div>
                    <div class="info-row"><span class="label">Product No.</span><span class="value">${product.product_no}</span></div>
                    <div class="info-row"><span class="label">Batch Number</span><span class="value">${product.batch}</span></div>
                    <div class="info-row"><span class="label">Origin</span><span class="value">${product.origin}</span></div>
                    <div class="info-row"><span class="label">Production Date</span><span class="value">${product.prod_date}</span></div>
                    <div class="info-row"><span class="label">Test Result</span><span class="value" style="color:#27ae60">${product.test_result}</span></div>
                    
                    <h3 style="margin-top:25px; font-size:1.1em">Logistics Timeline</h3>
                    <div class="timeline">${timelineHtml}</div>

                    <div class="status-badge">
                        Conclusion: ${product.traceability} 
                    </div>
                </div>
            `;
        } catch (err) {
            app.innerHTML = '<div class="error"><h2>System Error</h2><p>Could not load database.</p></div>';
        }
    }

    window.onload = loadTraceability;
</script>

</body>
</html>
